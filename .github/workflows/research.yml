name: Recheck public documentation
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated application IDs, or all"
        default: "27,61,80,90,98"
        required: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Research selected applications
        env:
          APP_IDS: ${{ inputs.ids }}
        shell: bash
        run: |
          if [[ "$APP_IDS" == "all" ]]; then
            python agent/research.py --out runs/workflow
          else
            python agent/research.py --ids "$APP_IDS" --out runs/workflow
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-documentation-recheck
          path: |
            runs/workflow/first-pass.json
            runs/workflow/run.json
          retention-days: 1
